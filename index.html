<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub User Finder</title>

    <style>
      /* =========================
       RESET
    ========================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(37, 99, 235, 0.08),
            transparent 35%
          ),
          #030712;

        color: #f8fafc;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        padding: 60px 20px;
      }

      /* =========================
       MAIN CONTAINER
    ========================= */

      .container {
        width: 100%;
        max-width: 760px;
        margin: auto;
      }

      /* =========================
       HEADER
    ========================= */

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .github-icon {
        width: 42px;
        height: 42px;

        margin: 0 auto 14px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid #1e293b;
        border-radius: 12px;

        background: #0f172a;

        font-size: 21px;
      }

      .header h1 {
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -1px;

        margin-bottom: 7px;
      }

      .header p {
        color: #64748b;
        font-size: 13px;
      }

      /* =========================
       SEARCH BAR
    ========================= */

      .search-wrapper {
        margin-bottom: 24px;
      }

      .search-form {
        width: 100%;

        display: flex;
        align-items: center;

        padding: 5px;

        background: #111827;

        border: 1px solid #273449;

        border-radius: 8px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .search-form:focus-within {
        border-color: #2563eb;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .search-icon {
        margin-left: 13px;

        color: #64748b;

        font-size: 15px;
      }

      .search-form input {
        flex: 1;

        height: 42px;

        padding: 0 12px;

        background: transparent;

        border: none;
        outline: none;

        color: #f8fafc;

        font-size: 13px;
      }

      .search-form input::placeholder {
        color: #64748b;
      }

      .search-form button {
        height: 38px;

        padding: 0 18px;

        border: none;
        border-radius: 6px;

        background: #2563eb;

        color: white;

        font-size: 12px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.2s ease;
      }

      .search-form button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      /* =========================
       PROFILE CARD
    ========================= */

      .profile-card {
        background: linear-gradient(145deg, #111827, #0d1525);

        border: 1px solid #263449;

        border-radius: 12px;

        padding: 24px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      /* =========================
       PROFILE TOP
    ========================= */

      .profile-top {
        display: flex;

        align-items: flex-start;

        gap: 20px;

        padding-bottom: 22px;

        border-bottom: 1px solid #1e293b;
      }

      .avatar {
        width: 86px;
        height: 86px;

        flex-shrink: 0;

        border-radius: 50%;

        border: 3px solid #334155;

        object-fit: cover;

        background: #1e293b;
      }

      .profile-info {
        flex: 1;

        min-width: 0;
      }

      .profile-name-row {
        display: flex;

        align-items: center;

        gap: 9px;

        margin-bottom: 3px;
      }

      .profile-name {
        font-size: 22px;

        font-weight: 700;

        letter-spacing: -0.5px;
      }

      .verified {
        width: 18px;
        height: 18px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #2563eb;

        color: white;

        font-size: 10px;
      }

      .username {
        color: #64748b;

        font-size: 13px;

        margin-bottom: 12px;
      }

      .bio {
        max-width: 550px;

        color: #94a3b8;

        font-size: 13px;

        line-height: 1.6;
      }

      /* =========================
       PROFILE META
    ========================= */

      .meta {
        display: flex;

        flex-wrap: wrap;

        gap: 14px 22px;

        margin-top: 16px;
      }

      .meta-item {
        display: flex;

        align-items: center;

        gap: 7px;

        color: #94a3b8;

        font-size: 12px;
      }

      .meta-icon {
        color: #64748b;

        font-size: 13px;
      }

      .meta-item a {
        color: #60a5fa;

        text-decoration: none;
      }

      .meta-item a:hover {
        text-decoration: underline;
      }

      /* =========================
       STATISTICS
    ========================= */

      .stats {
        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 10px;

        margin-top: 22px;
      }

      .stat-card {
        padding: 15px 12px;

        background: #0b1322;

        border: 1px solid #1e293b;

        border-radius: 8px;

        text-align: center;

        transition: 0.2s ease;
      }

      .stat-card:hover {
        border-color: #334155;

        background: #0f172a;
      }

      .stat-value {
        display: block;

        color: #f8fafc;

        font-size: 20px;

        font-weight: 700;

        margin-bottom: 4px;
      }

      .stat-label {
        color: #64748b;

        font-size: 10px;

        text-transform: uppercase;

        letter-spacing: 0.6px;
      }

      /* =========================
       PROFILE FOOTER
    ========================= */

      .profile-footer {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 15px;

        margin-top: 22px;
      }

      .joined {
        color: #64748b;

        font-size: 11px;
      }

      .profile-button {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        padding: 9px 14px;

        border-radius: 6px;

        background: #1e293b;

        border: 1px solid #334155;

        color: #e2e8f0;

        text-decoration: none;

        font-size: 11px;

        font-weight: 600;

        transition: 0.2s ease;
      }

      .profile-button:hover {
        background: #2563eb;

        border-color: #2563eb;

        color: white;
      }

      /* =========================
       REPOSITORIES
    ========================= */

      .repositories {
        margin-top: 18px;

        padding-top: 22px;

        border-top: 1px solid #1e293b;
      }

      .section-title {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 14px;
      }

      .section-title h2 {
        font-size: 14px;

        font-weight: 650;
      }

      .section-title span {
        color: #64748b;

        font-size: 11px;
      }

      .repo-grid {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
      }

      .repo {
        padding: 14px;

        border: 1px solid #1e293b;

        border-radius: 8px;

        background: #0b1322;
      }

      .repo-name {
        display: block;

        color: #60a5fa;

        font-size: 12px;

        font-weight: 600;

        text-decoration: none;

        margin-bottom: 6px;
      }

      .repo-name:hover {
        text-decoration: underline;
      }

      .repo-description {
        color: #64748b;

        font-size: 10px;

        line-height: 1.5;

        margin-bottom: 11px;
      }

      .repo-info {
        display: flex;

        align-items: center;

        gap: 13px;

        color: #64748b;

        font-size: 10px;
      }

      .language {
        display: flex;

        align-items: center;

        gap: 5px;
      }

      .language-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #f1e05a;
      }

      /* =========================
       LOADING SKELETON
    ========================= */

      .skeleton-card {
        display: none;

        background: #111827;

        border: 1px solid #263449;

        border-radius: 12px;

        padding: 24px;
      }

      .skeleton {
        position: relative;

        overflow: hidden;

        background: #1e293b;

        border-radius: 5px;
      }

      .skeleton::after {
        content: "";

        position: absolute;

        inset: 0;

        transform: translateX(-100%);

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.06),
          transparent
        );

        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      .skeleton-profile {
        display: flex;

        gap: 20px;
      }

      .skeleton-avatar {
        width: 86px;
        height: 86px;

        flex-shrink: 0;

        border-radius: 50%;
      }

      .skeleton-content {
        flex: 1;
      }

      .skeleton-name {
        width: 160px;
        height: 22px;

        margin-bottom: 8px;
      }

      .skeleton-username {
        width: 100px;
        height: 12px;

        margin-bottom: 16px;
      }

      .skeleton-bio {
        width: 80%;
        height: 12px;

        margin-bottom: 7px;
      }

      .skeleton-bio.small {
        width: 55%;
      }

      .skeleton-meta {
        display: flex;

        gap: 15px;

        margin-top: 15px;
      }

      .skeleton-meta-item {
        width: 90px;
        height: 11px;
      }

      .skeleton-stats {
        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 10px;

        margin-top: 22px;
      }

      .skeleton-stat {
        height: 66px;

        border-radius: 8px;
      }

      .heart {
        color: #ef4444;
        font-size: 12px;
      }

      /* =========================
       RESPONSIVE
    ========================= */

      @media (max-width: 650px) {
        body {
          padding: 35px 15px;
        }

        .header h1 {
          font-size: 25px;
        }

        .profile-card {
          padding: 18px;
        }

        .profile-top {
          gap: 14px;
        }

        .avatar {
          width: 70px;
          height: 70px;
        }

        .profile-name {
          font-size: 19px;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .repo-grid {
          grid-template-columns: 1fr;
        }

        .profile-footer {
          flex-direction: column;

          align-items: flex-start;
        }

        .profile-button {
          width: 100%;
        }
      }

      @media (max-width: 430px) {
        .search-form {
          padding: 4px;
        }

        .search-form button {
          padding: 0 13px;
        }

        .profile-top {
          flex-direction: column;

          align-items: center;

          text-align: center;
        }

        .profile-info {
          width: 100%;
        }

        .profile-name-row {
          justify-content: center;
        }

        .meta {
          justify-content: center;
        }

        .bio {
          margin: auto;
        }

        .skeleton-profile {
          flex-direction: column;

          align-items: center;
        }

        .skeleton-content {
          width: 100%;
        }

        .skeleton-name {
          margin-left: auto;
          margin-right: auto;
        }

        .skeleton-username {
          margin-left: auto;
          margin-right: auto;
        }

        .skeleton-bio {
          margin-left: auto;
          margin-right: auto;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- ================= HEADER ================= -->

      <header class="header">
        <div class="github-icon">◉</div>

        <h1>GitHub User Finder</h1>

        <p>Search and explore GitHub developer profiles</p>
      </header>

      <!-- ================= SEARCH ================= -->

      <div class="search-wrapper">
        <form class="search-form">
          <span class="search-icon"> 🔍 </span>

          <input
            type="text"
            placeholder="Enter GitHub username..."
            value="octocat"
            class="userInputField"
          />

          <button type="submit" class="search">Search</button>
        </form>
      </div>

      <!-- =================================================
         LOADING SKELETON
         
         Later, JavaScript can show this while the API
         request is running.
    ================================================== -->

      <section class="skeleton-card">
        <div class="skeleton-profile">
          <div class="skeleton skeleton-avatar"></div>

          <div class="skeleton-content">
            <div class="skeleton skeleton-name"></div>

            <div class="skeleton skeleton-username"></div>

            <div class="skeleton skeleton-bio"></div>

            <div class="skeleton skeleton-bio small"></div>

            <div class="skeleton-meta">
              <div class="skeleton skeleton-meta-item"></div>

              <div class="skeleton skeleton-meta-item"></div>

              <div class="skeleton skeleton-meta-item"></div>
            </div>
          </div>
        </div>

        <div class="skeleton-stats">
          <div class="skeleton skeleton-stat"></div>

          <div class="skeleton skeleton-stat"></div>

          <div class="skeleton skeleton-stat"></div>

          <div class="skeleton skeleton-stat"></div>
        </div>
      </section>

      <!-- =================================================
         REAL DUMMY GITHUB PROFILE
         
         Dummy data is based on fields GitHub exposes
         through its public user API.
    ================================================== -->

      <section class="profile-card">
        <!-- PROFILE HEADER -->
      </section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
